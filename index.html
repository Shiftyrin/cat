<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Introducing Cat</title>
  <style>
    /* Base Styles */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    .section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease-out, transform 1s ease-out;
      position: relative;
    }
    .visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Theme Classes */
    .theme-light {
      background-color: #fff;
      color: #000;
    }
    .theme-gray {
      background-color: #444;
      color: #ddd;
    }
    .theme-dark {
      background-color: #000;
      color: #fff;
    }
    /* Button Theme Overrides */
    body.theme-dark .button {
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.5);
      color: #fff;
    }
    body.theme-gray .button {
      background: rgba(200,200,200,0.1);
      border: 2px solid rgba(200,200,200,0.5);
      color: #ddd;
    }
    body.theme-light .button {
      background: rgba(0,0,0,0.1);
      border: 2px solid rgba(0,0,0,0.5);
      color: #000;
    }
    .button {
      padding: 15px 30px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.5);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, border 0.3s;
      border-radius: 50px;
    }
    .button:hover {
      background: rgba(255,255,255,0.3);
      border: 2px solid rgba(255,255,255,0.7);
    }
    /* Positioning for Section 5's "See the Truth" button */
    #section5 .button {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
    }
    /* Navigation Buttons in Reveal */
    .nav-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }
    .nav-buttons .button {
      margin: 0 10px;
      position: static;
      transform: none;
    }
    /* Reveal Section */
    #reveal {
      display: none;
      height: 100vh;
      background: inherit;
      color: inherit;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      position: relative;
    }
    .transition-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: inherit;
      opacity: 1;
      transition: opacity 2s ease-in-out;
    }
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
    #truth-text {
      transition: opacity 0.5s ease-in-out;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
    /* Watermark Image Behind Text in Sections 1–5 */
    .text-with-image {
      position: relative;
      display: inline-block;
    }
    .text-with-image img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      opacity: 0.7;
      width: 950px; /* Adjust size here */
    }
    .text-with-image h1,
    .text-with-image h2 {
      position: relative;
      z-index: 1;
      margin: 0;
    }
  </style>
</head>
<body>
  <!-- Section 1 -->
  <div class="section" id="section1" data-theme="theme-dark">
    <div class="text-with-image">
      <img src="https://i.postimg.cc/1zndDfyF/Pngtree-isolated-cat-on-white-background-9158356.png" alt="Cat Icon">
      <h1>Introducing Cat</h1>
    </div>
  </div>
  <!-- Section 2 -->
  <div class="section" id="section2" data-theme="theme-gray">
    <div class="text-with-image">
      <img src="https://i.postimg.cc/C58wF0b7/Pngtree-isolated-sitting-orange-cat-on-9158396.png" alt="Cat Icon">
      <h2>A Vision of Elegance</h2>
    </div>
  </div>
  <!-- Section 3 -->
  <div class="section" id="section3" data-theme="theme-light">
    <div class="text-with-image">
      <img src="https://i.postimg.cc/1zndDfyF/Pngtree-isolated-cat-on-white-background-9158356.png" alt="Cat Icon">
      <h2>Bring Colours To Your Life</h2>
    </div>
  </div>
  <!-- Section 4 -->
  <div class="section" id="section4" data-theme="theme-dark">
    <div class="text-with-image">
      <img src="https://i.postimg.cc/1zndDfyF/Pngtree-isolated-cat-on-white-background-9158356.png" alt="Cat Icon">
      <h2>The Perfect Companion As It Never Leaves You</h2>
    </div>
  </div>
  <!-- Section 5 -->
  <div class="section" id="section5" data-theme="theme-gray">
    <div class="text-with-image">
      <img src="https://i.postimg.cc/1zndDfyF/Pngtree-isolated-cat-on-white-background-9158356.png" alt="Cat Icon">
      <h2>Got A Feedback?</h2>
      <h3>Press the learn More Button</h3>
    </div>
    <button class="button" onclick="showReveal()">Learn More</button>
  </div>
  
  <!-- Transition and Reveal Section -->
  <div id="transition" class="transition-effect hidden"></div>
  <div id="reveal">
    <p id="truth-text"></p>
    <div class="nav-buttons">
      <button id="prev-btn" class="button" onclick="prevTruth()">Previous</button>
      <button id="next-btn" class="button" onclick="nextTruth()">Next</button>
    </div>
  </div>
  
  <!-- Background Music -->
  <audio id="background-music" src="https://whyp.it/tracks/256616/misery-business-synthv-cover-rough-draft-thrust-plugin" autoplay loop muted>
    Your browser does not support the audio element.
  </audio>
  
  <script>
    // Unmute background music on first user interaction
    document.addEventListener('click', () => {
      const music = document.getElementById('background-music');
      if (music.muted) {
        music.muted = false;
        music.play();
      }
    }, { once: true });
    
    // Intersection Observer to update theme as soon as each section appears
    const sections = document.querySelectorAll('.section');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          // Get the theme from the data attribute and update the body class immediately
          const theme = entry.target.getAttribute('data-theme');
          if (theme) {
            document.body.className = theme;
          }
        }
      });
    }, { threshold: 0.5 });
    sections.forEach(section => observer.observe(section));
    
    // Truth section messages and navigation with looping and theme cycling
    const truthMessages = [
      "The truth is...",
      "It was never about the cat.",
      "It was always about you.",
      "You've made my life full of colors.",
      "I found that you will be my best companion.",
      "You'd always support me through highs and lows.",
      "Although...",
      "I may not be able to provide what others do,",
      "I can't always be there to hang out,",
      "I can't send you lavish presents,",
      "But one thing is certain...",
      "I'll always be by your side.",
      "I'll offer you endless support.",
      "Even if 8 billion people say 'that rock is blue',",
      "And you insist 'that rock is white',",
      "I'll confidently say, 'That rock is white.'",
      "So...",
      "Let's embark on a journey,",
      "Just the two of us,",
      "Slowly,",
      "Until even the gods part us.",
      "Dear Fella Fikri Attaqi,",
      "Would you like to join me on this journey?"
    ];
    let currentTruthIndex = 0;
    
    function showReveal() {
      document.getElementById('transition').classList.remove('hidden');
      setTimeout(() => {
        document.getElementById('reveal').style.display = 'flex';
        document.getElementById('reveal').scrollIntoView({ behavior: 'smooth' });
        currentTruthIndex = 0;
        updateTruth();
      }, 2000);
    }
    
    function updateTruth() {
      const truthText = document.getElementById('truth-text');
      truthText.style.opacity = 0; // Fade out
      setTimeout(() => {
        truthText.innerHTML = truthMessages[currentTruthIndex];
        truthText.style.opacity = 1; // Fade in
        updateTheme();
        updateNavButtons();
      }, 500);
    }
    
    function nextTruth() {
      currentTruthIndex = (currentTruthIndex + 1) % truthMessages.length;
      updateTruth();
    }
    
    function prevTruth() {
      currentTruthIndex = (currentTruthIndex - 1 + truthMessages.length) % truthMessages.length;
      updateTruth();
    }
    
    function updateTheme() {
      // Cycle theme based on currentTruthIndex mod 3
      const themeIndex = currentTruthIndex % 3;
      if (themeIndex === 0) {
        document.body.className = "theme-dark";
      } else if (themeIndex === 1) {
        document.body.className = "theme-gray";
      } else {
        document.body.className = "theme-light";
      }
    }
    
    function updateNavButtons() {
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      
      if (currentTruthIndex === 0) {
        // At first truth: show "Back to Start" on left, "Next" on right
        prevBtn.innerText = "Back to Start";
        prevBtn.onclick = backToStart;
        nextBtn.innerText = "Next";
        nextBtn.onclick = nextTruth;
      } else if (currentTruthIndex === truthMessages.length - 1) {
        // At last truth: show "Previous" on left, "Back to Start" on right
        prevBtn.innerText = "Previous";
        prevBtn.onclick = prevTruth;
        nextBtn.innerText = "Back to Start";
        nextBtn.onclick = backToStart;
      } else {
        // Otherwise, show "Previous" and "Next"
        prevBtn.innerText = "Previous";
        prevBtn.onclick = prevTruth;
        nextBtn.innerText = "Next";
        nextBtn.onclick = nextTruth;
      }
    }
    
    function backToStart() {
      document.getElementById('reveal').style.display = 'none';
      document.getElementById('transition').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
